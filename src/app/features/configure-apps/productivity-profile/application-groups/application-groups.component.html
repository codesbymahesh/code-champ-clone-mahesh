<div class="flex flex-col h-full">

  <!-- Sticky Header -->
  <div class="sticky top-0 bg-white border-b border-gray-200 z-10">
    <div class="grid grid-cols-12 gap-4 p-4 items-center bg-gray-200">
      <div class="col-span-4">
        <h3 class="text-sm font-medium text-gray-900">Application Group</h3>
      </div>
      <div class="col-span-4">
        <h3 class="text-sm font-medium text-gray-900">Idle Time Configuration</h3>
      </div>
      <div class="col-span-4 flex items-center">
        <div class="flex-1 relative">
          <input 
            type="text" 
            placeholder="Search"
            [(ngModel)]="searchTerm"
            class="w-full px-3 py-1.5 border border-gray-300 rounded text-xs focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
          >
          <svg class="w-3 h-3 absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Scrollable Body -->
  <div class="flex-1 overflow-y-auto max-h-[400px]">
    <table class="w-full table-fixed">
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let group of filteredGroups" class="hover:bg-gray-50 transition-colors">
          <td class="px-4 py-3 text-sm text-gray-900 w-1/3">{{ group.name }}</td>
          <td class="px-4 py-3 text-sm text-gray-600 w-1/3">
            <div class="flex items-center gap-2">
              <span>{{ group.idleTimeConfig }}</span>
              <button 
                (click)="openEditModal(group)"
                class="text-gray-400 hover:text-gray-600 transition-colors"
                title="Edit idle time configuration"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
              </button>
            </div>
          </td>
          <td class="px-4 py-3 w-1/3">
            <div class="flex items-center gap-2">
              <button
                (click)="setProductivity(group, true)"
                [class]="getProductiveButtonClass(group)"
                class="inline-flex items-center px-3 py-1.5 rounded-md text-xs font-medium cursor-pointer transition-all duration-200"
              >
                PRODUCTIVE
              </button>
              <button
                (click)="setProductivity(group, false)"
                [class]="getNonProductiveButtonClass(group)"
                class="inline-flex items-center px-3 py-1.5 rounded-md text-xs font-medium cursor-pointer transition-all duration-200 whitespace-nowrap"
              >
                NON-PRODUCTIVE
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal for Idle Time Configuration -->
<div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
    
    <!-- Modal Header -->
    <div class="bg-teal-500 text-white px-6 py-4 rounded-t-lg">
      <h2 class="text-lg font-semibold">Set Application Group Idle Configuration</h2>
    </div>
    
    <!-- Modal Content -->
    <div class="p-6">
      <div class="text-center mb-6">
        <h3 class="text-lg font-medium text-gray-900">{{ selectedGroup?.name }}</h3>
      </div>
      
      <!-- Idle Configuration Options -->
      <div class="flex justify-center gap-3 mb-6">
        <button 
          *ngFor="let option of idleConfigOptions"
          (click)="selectedIdleConfig = option.value"
          [class]="selectedIdleConfig === option.value ? 'bg-teal-500 text-white' : 'bg-gray-200 text-gray-700'"
          class="px-4 py-2 rounded-full text-sm font-medium transition-colors duration-200 hover:opacity-80 flex items-center gap-1"
        >
          {{ option.label }}
          <svg *ngIf="option.value === 'No Idle Time'" class="w-4 h-4 ml-1" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
        </button>
      </div>
      
      <!-- Modal Actions -->
      <div class="flex justify-center gap-4">
        <button 
          (click)="closeModal()"
          class="px-6 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition-colors duration-200 flex items-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
          Cancel
        </button>
        <button 
          (click)="updateIdleConfig()"
          class="px-6 py-2 bg-teal-500 text-white rounded hover:bg-teal-600 transition-colors duration-200 flex items-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          Update
        </button>
      </div>
    </div>
  </div>
</div>
