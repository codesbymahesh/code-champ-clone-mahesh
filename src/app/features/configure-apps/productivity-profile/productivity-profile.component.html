<!-- Split-pane layout: Fixed left sidebar + flexible right content -->
<div class="flex h-full">
  
  <!-- Left pane: Fixed width ~300px with search and list -->
  <div class="w-80 border-r border-gray-200 flex flex-col">
    
    <!-- Search section with input and add button -->
    <div class="p-4 border-b border-gray-200">
      <div class="flex gap-2">
        <!-- Search input field -->
        <div class="flex-1 relative">
          <input 
            type="text" 
            placeholder="Search"
            [(ngModel)]="searchTerm"
            (input)="onSearch()"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
          >
          <!-- Search icon -->
          <svg class="w-4 h-4 absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        
        <!-- Add button with + icon -->
        <button 
          (click)="openAddModal()"
          class="px-3 py-2 bg-teal-500 text-white rounded-md hover:bg-teal-600 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- List of user-added items -->
    <div class="flex-1 overflow-y-auto">
      <ul class="p-2">
        <li 
          *ngFor="let profile of filteredProfiles; let i = index"
          class="p-3 mb-2 bg-white rounded border hover:bg-gray-50 cursor-pointer transition-colors"
          [class.bg-teal-50]="profile.isDefault"
        >
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-gray-900">{{ profile.name }}</span>
              <span 
                *ngIf="profile.isDefault"
                class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-teal-100 text-teal-800"
              >
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Default
              </span>
            </div>
            <div class="flex gap-2">
              <!-- Edit icon -->
              <svg 
                (click)="openEditModal(profile, i)"
                class="w-4 h-4 text-gray-700 hover:text-gray-600 cursor-pointer transition-colors" 
                fill="none" 
                stroke="currentColor" 
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
              <!-- Delete icon -->
              <svg 
                (click)="openDeleteModal(profile, i)"
                class="w-4 h-4 text-gray-700 hover:text-red-500 cursor-pointer transition-colors" 
                fill="none" 
                stroke="currentColor" 
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
              </svg>
            </div>
          </div>
        </li>
        
        <!-- Empty state when no profiles match search -->
        <li *ngIf="filteredProfiles.length === 0" class="p-4 text-center text-gray-500 text-sm">
          No profiles found
        </li>
      </ul>
    </div>
  </div>

  <!-- Right pane: Flexible content area with tertiary tabs -->
  <div class="flex-1 flex flex-col">
    
    <!-- Tertiary tab navigation (underline style) -->
    <div class="border-b border-gray-200 bg-white">
      <nav class="flex space-x-8 px-6" aria-label="Tertiary tabs">
        <!-- Application Groups tab (default active) -->
        <a 
          routerLink="application-groups" 
          routerLinkActive="border-teal-500 text-teal-600"
          class="whitespace-nowrap py-4 px-1 border-b-2  font-medium text-sm text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors"
        >
          Application Groups
        </a>
        
        <!-- Teams tab -->
        <a 
          routerLink="teams" 
          routerLinkActive="border-teal-500 text-teal-600"
          class="whitespace-nowrap py-4 px-1 border-b-2  font-medium text-sm text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors"
        >
          Teams
        </a>
        
        <!-- Users tab -->
        <a 
          routerLink="users" 
          routerLinkActive="border-teal-500 text-teal-600"
          class="whitespace-nowrap py-4 px-1 border-b-2  font-medium text-sm text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors"
        >
          Users
        </a>
      </nav>
    </div>

    <!-- Tab content area -->
    <div class="flex-1 overflow-hidden">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div 
  *ngIf="showAddEditModal" 
  class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center"
  (click)="closeAddEditModal()"
>
  <div 
    class="relative bg-white rounded-lg shadow-xl max-w-md w-full mx-4"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal header -->
    <div class="bg-teal-500 text-white px-6 py-4 rounded-t-lg">
      <h3 class="text-lg font-semibold">
        {{ isEditMode ? 'Edit Productivity Profile' : 'Manage Productivity Profile' }}
      </h3>
    </div>
    
    <!-- Modal body -->
    <div class="p-6">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Productivity Profile Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="profileName"
          placeholder="Enter profile name"
          class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
          [class.border-red-500]="showNameError"
        >
        <p *ngIf="showNameError" class="mt-1 text-sm text-red-600">
          Profile name is required
        </p>
      </div>
    </div>
    
    <!-- Modal footer -->
    <div class="px-6 py-4 bg-gray-50 rounded-b-lg flex justify-end space-x-3">
      <button
        (click)="closeAddEditModal()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors"
      >
        <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
        Cancel
      </button>
      <button
        (click)="saveProfile()"
        class="px-4 py-2 bg-gray-400 text-white rounded-md text-sm font-medium hover:bg-gray-500 transition-colors"
      >
        <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        {{ isEditMode ? 'Update' : 'Add' }}
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div 
  *ngIf="showDeleteModal" 
  class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center"
  (click)="closeDeleteModal()"
>
  <div 
    class="relative bg-white rounded-lg shadow-xl max-w-md w-full mx-4"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal header -->
    <div class="bg-teal-500 text-white px-6 py-4 rounded-t-lg">
      <h3 class="text-lg font-semibold">Delete the productivity profile</h3>
    </div>
    
    <!-- Modal body -->
    <div class="p-6">
      <p class="text-gray-600">
        Are you sure you want to delete this productivity profile?
      </p>
    </div>
    
    <!-- Modal footer -->
    <div class="px-6 py-4 bg-gray-50 rounded-b-lg flex justify-end space-x-3">
      <button
        (click)="closeDeleteModal()"
        class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors"
      >
        <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
        Cancel
      </button>
      <button
        (click)="deleteProfile()"
        class="px-4 py-2 bg-teal-500 text-white rounded-md text-sm font-medium hover:bg-teal-600 transition-colors"
      >
        <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        Delete
      </button>
    </div>
  </div>
</div>
