<header class="bg-white border-b border-gray-200 px-6 py-2">
      <div class="flex items-center justify-end">
        <!-- Left side - empty as per requirements -->
        <div></div>
        
        <!-- Center -->
        <div class="flex items-center  space-x-4">
          <button class="btn-outline px-4 py-2 rounded-md border border-gray-300 text-gray-700 font-medium hover:bg-gray-50">
            Customer Success
          </button>
          <button class="btn-outline px-4 py-2 rounded-md border border-gray-300 text-gray-700 font-medium hover:bg-gray-50">
            📥 Download Agent
          </button>
        </div>
        
        <!-- Right side -->
        <div class="flex items-center space-x-4">
          <!-- Vertical divider -->
          <div class="h-6 w-px bg-gray-300"></div>
          
          <!-- Settings gear icon -->
          <button class="p-2 text-gray-500 hover:text-gray-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </button>
          
          <!-- Profile dropdown -->
          <div class="relative">
            <button 
              class="flex items-center space-x-2 p-2 rounded-md hover:bg-gray-100"
              (click)="toggleProfileDropdown()"
            >
              <img 
                src="https://ui-avatars.com/api/?name=btrak&background=10b981&color=fff&size=32" 
                alt="Profile" 
                class="w-8 h-8 rounded-full"
              >
              <div class="text-left">
                <div class="text-sm font-medium text-gray-900">btrak</div>
                <div class="text-xs text-gray-500">btrak10039-qqa.com</div>
              </div>
              <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
            
            <!-- Dropdown menu -->
            <div 
              *ngIf="showProfileDropdown" 
              class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg ring-1 ring-black ring-opacity-5 z-50"
            >
              <div class="py-1">
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sign out</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
